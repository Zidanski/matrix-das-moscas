[project]
name = "matrix-das-moscas"
version = "0.1.0"
description = "Um mundo 3D falso habitado por 6 Drosophilas cujo comportamento sai de emulacoes de cerebro inteiro (FlyWire v783 e MaleCNS v1.0)."
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "numba>=0.61",
    "numpy>=2.2,<2.4",
    "pandas>=2.2",
    "psutil>=7.2.2",
    "pyarrow>=19",
    "pyyaml>=6.0.3",
    "scipy>=1.14",
    "tqdm>=4.70.1",
    "websockets>=17.1",
]

[project.scripts]
matrix = "matrix.cli:main"

[dependency-groups]
dev = [
    "brian2>=2.8,<2.10",
    "matplotlib>=3.9",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain", "interface", "world", "replay", "matrix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "data: precisa dos conectomas baixados em data/ (pulado se ausentes)",
    "slow: demora minutos",
]
