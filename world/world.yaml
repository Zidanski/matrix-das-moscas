# =============================================================================
# O MUNDO (superficie) - geometria, fisica simples e sensores
# =============================================================================
# Unidades: cm de escala mosca; segundos biologicos. Tudo aqui e premissa.
# O codigo do mundo NUNCA move uma mosca: so transforma a situacao fisica em
# estimulos (interface/config.yaml) e reage ao que as moscas fazem.

arena:
  radius_cm: 25.0          # arena circular (parede = contato na antena); menor = mais encontros
  hills:                   # colinas de cor chapada: gaussianas de altura (x, y, sigma, altura)
    - [  8,   7,  7, 2.0]
    - [-10,  -5,  8, 1.6]
    - [  3, -12,  5, 1.0]
  day_length_s: 30.0       # um "dia" completo (luz = 0.5 + 0.5*cos); dias de 30 s biologicos (intervencao: era 60)
  night_odor_scale: 0.6    # a noite os odores enfraquecem
  night_loom_scale: 1.3    # a noite os vultos assustam mais

fly:
  body_length_cm: 0.25
  contact_radius_cm: 0.30      # pernas/labelo tocam o que esta a esta distancia da superficie
  antenna_forward_cm: 0.15     # antenas a frente e aos lados da cabeca
  antenna_lateral_cm: 0.10
  encounter_cm: 1.0            # "encontro" = duas moscas a menos de 1 cm
  jump_impulse_cm_s: 8.0       # salto da fibra gigante
  jump_duration_s: 0.12
  hunger_rise_per_s: 0.03      # ganho de fome sobe 1.0 -> 2.0 em ~33 s sem comer
  hunger_max: 2.0
  water_trap_depth_cm: 1.0     # entrou mais que isso na agua: presa ate ser tocada

objects:
  spheres:                     # rolam quando empurradas (massa pequena); superficie doce ou amarga
    - {name: bola_doce_1,   x:  5.0, y:  3.0, r: 1.2, surface: sugar,  mass: 0.5}
    - {name: bola_doce_2,   x: -7.0, y:  8.0, r: 1.0, surface: sugar,  mass: 0.4}
    - {name: bola_amarga_1, x:  2.0, y: -6.0, r: 1.1, surface: bitter, mass: 0.5}
    - {name: bola_neutra_1, x: -5.0, y: -10.0, r: 1.5, surface: none, mass: 0.8}
  cubes:                       # fixos: abrigo (bloqueiam looming) e cubos ocos (placas de pressao, F4)
    - {name: cubo_1, x: -3.0, y: 4.0, size: 2.5, hollow: false}
    - {name: cubo_oco, x: 9.0, y: -10.0, size: 3.5, hollow: true}
  prisms:                      # rampas/marcos de odor (fontes de CO2 ou comida)
    - {name: prisma_co2,    x: -15.0, y: 0.0,  size: 3.0, odor: co2,  strength: 1.0, sigma_cm: 7.0}
    - {name: prisma_comida, x: 12.0,  y: 11.0, size: 3.0, odor: food, strength: 1.0, sigma_cm: 7.0}
  patches:                     # manchas no chao (S1 usa duas de acucar a 3 cm)
    - {name: mancha_acucar_1, x: 0.0, y: 0.0,  r: 1.0, kind: sugar, odor_sigma_cm: 6.0}
    - {name: mancha_acucar_2, x: 3.0, y: 0.0,  r: 1.0, kind: sugar, odor_sigma_cm: 6.0}
    - {name: mancha_geosmina, x: -9.0, y: -15.0, r: 1.5, kind: geosmin, odor_sigma_cm: 5.0}
  water:                       # plano azul falso (GRNs de agua; armadilha por tensao superficial)
    - {name: lago, x: 14.0, y: -6.0, r: 5.0}
  decor:                       # so visual (sem fisica): arvores (cone/esfera em haste) e formas
    trees:
      - {x: -12, y: 10, kind: cone, h: 4.0}
      - {x: -18, y: -8, kind: sphere, h: 3.5}
      - {x: 6, y: 16, kind: cone, h: 5.0}
      - {x: 16, y: 4, kind: sphere, h: 3.0}
      - {x: -4, y: -20, kind: cone, h: 4.5}
      - {x: 19, y: -14, kind: sphere, h: 3.2}
      - {x: -20, y: 6, kind: cone, h: 3.8}
      - {x: 0, y: 21, kind: sphere, h: 4.2}
      - {x: 21, y: 9, kind: cone, h: 3.0}
      - {x: -16, y: -16, kind: sphere, h: 2.8}
    shapes:
      - {x: -8, y: 18, kind: pyramid, size: 2.5, color: "#ff8fab"}
      - {x: 18, y: -2, kind: torus, size: 1.8, color: "#ffd166"}
      - {x: -21, y: -2, kind: column, size: 1.2, color: "#cdb4db"}
      - {x: 10, y: 19, kind: pyramid, size: 2.0, color: "#9bf6ff"}
      - {x: -14, y: 17, kind: torus, size: 1.5, color: "#caffbf"}
      - {x: 4, y: -21, kind: column, size: 1.0, color: "#ffc6ff"}

senses:                        # como a fisica vira valor [0,1] por lado (antes dos ganhos do config)
  odor_sigma_default_cm: 6.0
  cva_sigma_cm: 3.0            # perfil de odor do macho (cVA) em volta dele
  cva_strength: 1.0
  song_radius_cm: 4.0          # cancao audivel ate aqui (1/(1+d))
  loom_gain: 2.0               # valor = min(1, d(theta)/dt / loom_gain) [rad/s]. Era 0,25 e depois 1,0 (dia ao vivo de 240 s: 1251 saltos): no mundo de 25 cm cada salto virava vulto para todas e havia ~450 saltos/min (intervencao registrada em interface/config.yaml)
  small_object_radius_cm: 6.0  # LC11: outra mosca em movimento ate aqui
  small_object_min_speed_cm_s: 0.2
  side_sharpness: 1.0          # esq/dir = 0.5 +- 0.5*sin(bearing)*sharpness

flies:                         # nomes curtos, cor, sexo, semente
  - {name: Ada,  sex: female, color: "#e63946", seed: 11}
  - {name: Bia,  sex: female, color: "#f4a261", seed: 12}
  - {name: Cleo, sex: female, color: "#c77dff", seed: 13}
  - {name: Dan,  sex: male,   color: "#457b9d", seed: 21}
  - {name: Edu,  sex: male,   color: "#2a9d8f", seed: 22}
  - {name: Fil,  sex: male,   color: "#00b4d8", seed: 23}
spawn_radius_cm: 6.0           # posicoes iniciais ao acaso dentro deste raio (perto umas das outras)

# -----------------------------------------------------------------------------
# CAMADA SOCIAL GAMIFICADA (estilo The Sims) - NAO vem do cerebro; ver world/social.py
# -----------------------------------------------------------------------------
social:
  enabled: true
  social_rise_per_s: 0.03        # (era 0,012) o dono pediu interacoes frequentes
  fun_rise_per_s: 0.025          # (era 0,010)
  romance_rise_male_per_s: 0.03  # (era 0,012)
  romance_rise_female_per_s: 0.015
  explore_rise_per_s: 0.02       # NOVO: curiosidade leva a rampa do laboratorio (e, la dentro, a porta e ao elevador)
  wish_threshold: 0.45           # (era 0,6)
  idle_ticks_before_wish: 8      # (era 20) cerebro ocioso por 0,12 s antes de a camada assumir
  walk_cm_s: 1.5                 # (era 1,0)
  turn_gain: 2.5
  flirt_accept_base: 0.5         # (era 0,4)
  cooldown_flirt_s: 8            # (era 12)
  cooldown_dance_s: 10           # (era 20)
  cooldown_meet_s: 5             # (era 10)

brains:
  female_full: flywire783
  female_reduced: flywire783_k3
  male_full: malecns10
  male_reduced: malecns10_k3
  max_concurrent: 4            # processos ativos por vez (round-robin de 15 ms)

# -----------------------------------------------------------------------------
# O LABORATORIO (subsolo): corredores, salas, robos, segredos S1-S4
# -----------------------------------------------------------------------------
lab:
  depth_cm: 10.0               # so visual: o subsolo e desenhado a esta profundidade
  bounds: [-20.0, -14.0, 20.0, 14.0]   # x0, y0, x1, y1 (retangulo)
  walls:                       # retangulos solidos [x, y, w, h] (centro, largura, altura)
    - [0.0,  9.0, 1.0, 10.0]   # parede central norte (deixa o vao da porta S2 entre y=-4 e y=4)
    - [0.0, -9.0, 1.0, 10.0]   # parede central sul
    - [10.0, 6.0, 8.0, 1.0]    # divisoria da sala dos robos
  rooms:                       # so rotulos/visual
    - {name: corredor_de_chegada, x: -10, y: 0, w: 18, h: 26}
    - {name: sala_dos_robos, x: 10, y: -4, w: 18, h: 18}
    - {name: sala_das_telas, x: 10, y: 10, w: 18, h: 6}
  entries:                     # onde a mosca aparece ao entrar por cada caminho
    rampa: [-16.0, 0.0]        # prisma_co2 na superficie e a rampa
    escotilha: [9.0, -10.0]    # sob o cubo oco (S1 abre)
    lago: [14.0, 8.0]          # fundo do lago falso (presa por muito tempo, afunda)
  exit_surface: [-12.0, 3.0]   # onde os robos soltam moscas capturadas na superficie
  lake_sink_s: 8.0             # presa na agua por mais que isso sem resgate: afunda para o subsolo
  sugar_patch: {x: -12.0, y: -8.0, r: 1.0}   # o laboratorio alimenta os sujeitos (mancha de acucar)
  secrets:
    s1_placa_dupla: {patches: [mancha_acucar_1, mancha_acucar_2], hatch_open_s: 20.0, near_cm: 3.0}
    s2_corredor:    {door: {x: 0.0, y: 0.0, w: 1.0, h: 8.0}, sing_cm: 4.0, female_cm: 12.0, open_s: 20.0}   # intervencao: era 2,5 / 5 / 10
    s3_alavanca:    {lever: [16.0, -2.0], hit_cm: 1.5, chase_cm: 8.0, generator_off_s: 25.0}              # intervencao: era 0,8 / 20
    s4_elevador:    {zone: {x: 14.0, y: 4.0, w: 8.0, h: 8.0}, min_flies: 2, open_after_s3_s: 40.0}        # intervencao: era 5x5 em (17,-11), 3 moscas, 20 s
  robots:
    speed_cm_s: 1.5
    detect_cm: 7.0             # perseguem moscas ate esta distancia (mesmo nivel)
    capture_contact_s: 1.5     # contato continuo sem fuga = captura
    radius_cm: 1.2
    patrol:
      - {name: R1, level: lab, route: [[6, -10], [16, -10], [16, 2], [6, 2]]}
      - {name: R2, level: lab, route: [[4, 10], [16, 10], [16, 8], [4, 8]]}
      - {name: R3, level: surface, night_only: true, route: [[-8, -8], [8, -8], [8, 8], [-8, 8]]}
