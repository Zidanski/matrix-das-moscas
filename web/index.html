<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Matrix das Moscas</title>
    <style>
      :root { --bg: #0b0f14; --panel: rgba(10, 14, 20, 0.82); --fg: #e6edf3; --muted: #8b98a5; --accent: #7ee787; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
      #app { position: relative; width: 100%; height: 100%; }
      canvas { display: block; }
      #hud { position: absolute; top: 10px; left: 10px; background: var(--panel); padding: 10px 12px; border-radius: 8px; max-width: 360px; pointer-events: none; }
      #hud h1 { font-size: 15px; margin: 0 0 4px; }
      #hud .muted { color: var(--muted); }
      #flies { position: absolute; top: 10px; right: 10px; background: var(--panel); padding: 8px 10px; border-radius: 8px; }
      #flies button { display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent; color: var(--fg); padding: 4px 6px; border-radius: 6px; cursor: pointer; font: inherit; }
      #flies button.active { border-color: var(--accent); }
      #flies .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
      #timeline { position: absolute; left: 10px; right: 10px; bottom: 10px; background: var(--panel); padding: 8px 12px; border-radius: 8px; display: flex; gap: 10px; align-items: center; }
      #timeline input[type=range] { flex: 1; }
      #timeline button, #timeline select { background: #1f2933; color: var(--fg); border: 1px solid #334; border-radius: 6px; padding: 4px 8px; font: inherit; cursor: pointer; }
      #events { position: absolute; left: 10px; right: 10px; bottom: 54px; height: 14px; pointer-events: none; }
      #events span { position: absolute; bottom: 0; width: 2px; height: 14px; }
      #diary { display: none; position: absolute; left: 10px; bottom: 60px; width: min(560px, calc(100% - 20px)); max-height: 60%; overflow: auto; background: var(--panel); padding: 10px 14px; border-radius: 8px; }
      #diary pre { white-space: pre-wrap; font: 12px/1.45 system-ui, sans-serif; margin: 0; }
      #brainpanel { display: none; position: absolute; right: 10px; bottom: 60px; width: 320px; background: var(--panel); border-radius: 8px; padding: 8px 10px; }
      #brainpanel canvas { display: block; width: 300px; height: 140px; margin-top: 6px; }
      #braincanvas { position: absolute; right: 10px; bottom: 270px; width: 320px; height: 260px; border-radius: 8px; background: rgba(0,0,0,0.6); display: none; }
      body.matrix #braincanvas { inset: 0; width: 100%; height: 100%; border-radius: 0; background: #000; z-index: 0; }
      body.matrix canvas.world { opacity: 0.35; position: relative; z-index: 1; }
      #god { display: none; position: absolute; left: 10px; bottom: 60px; width: min(620px, calc(100% - 20px)); background: var(--panel); padding: 10px 14px; border-radius: 8px; font-size: 12px; }
      #god .row { margin: 6px 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      #god button { background: #2b3440; color: var(--fg); border: 1px solid #456; border-radius: 6px; padding: 3px 8px; font: inherit; cursor: pointer; }
      #god label { margin-right: 6px; }
      #dossier { display: none; position: absolute; right: 10px; top: 200px; width: 340px; max-height: calc(100% - 300px); overflow: auto; background: var(--panel); padding: 10px 12px; border-radius: 8px; font-size: 12px; }
      #dossier h3 { margin: 6px 0 4px; font-size: 13px; }
      #dossier ul { margin: 0; padding-left: 16px; }
      #dossier .log li { color: var(--muted); }
      #dossier .bars { font-family: ui-monospace, monospace; white-space: pre-wrap; }
      .liveonly { display: none; }
      body.live .liveonly { display: inline-block; }
      #load { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--muted); font-size: 16px; z-index: 1; pointer-events: none; }
      #load button { pointer-events: auto; background: #e63946; color: #fff; border: none; border-radius: 10px; padding: 12px 22px; font: inherit; font-size: 18px; cursor: pointer; margin-left: 12px; }
      #hud, #flies, #timeline, #events, #diary, #god, #dossier, #brainpanel, #braincanvas { z-index: 5; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud"><h1>A Matrix das Moscas</h1><div id="hudbody" class="muted">carregando…</div></div>
      <div id="flies"></div>
      <div id="events"></div>
      <div id="timeline">
        <button id="livebtn" title="entrar no modo ao vivo" style="background:#3a1d24;border-color:#e63946">🔴 AO VIVO</button>
        <select id="run"></select>
        <button id="play">▶</button>
        <button id="stopbtn" class="liveonly" title="parar o ao vivo e gravar o dia">⏹ parar</button>
        <button id="resetbtn" class="liveonly" title="reiniciar o ao vivo do zero">↺ reiniciar</button>
        <button id="nowbtn" class="liveonly" title="voltar a acompanhar o presente">⏭ agora</button>
        <select id="speed"><option value="0.25">0,25×</option><option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
        <input id="scrub" type="range" min="0" max="1" step="1" value="0" />
        <span id="clock" class="muted">0,0 s</span>
        <select id="cam"><option value="orbit">câmera livre</option><option value="follow">seguir mosca</option><option value="top">de cima</option><option value="security">câmera de segurança (lab)</option></select>
        <button id="diarybtn">📓 diário</button>
        <button id="brainbtn" title="painel do cérebro da mosca selecionada">🧠 cérebro</button>
        <button id="matrixbtn" title="corte Matrix: o cérebro por trás do mundo">🟩 Matrix</button>
        <button id="recbtn" title="gravar vídeo (webm)">⏺ vídeo</button>
        <button id="godbtn" title="modo Deus (só ao vivo)">⚡ Deus</button>
        <span id="livestatus" class="muted"></span>
      </div>
      <div id="diary"></div>
      <div id="dossier"><div id="dossierbody"></div></div>
      <div id="god">
        <b>⚡ Modo Deus</b> <span class="muted">(age na simulação ao vivo; a mosca-alvo é a selecionada)</span><br>
        <div class="row"><b>Língua</b>
          <label><input type="checkbox" data-mute="song"> mudo canção</label>
          <label><input type="checkbox" data-mute="cva"> mudo feromônio (cVA)</label>
          <label><input type="checkbox" data-mute="contact"> mudo contato</label></div>
        <div class="row"><b>Cérebro da selecionada</b>
          <button data-cmd="reset_brain">reiniciar</button> <button data-cmd="save_brain">salvar estado</button>
          <button data-cmd="restore_brain">restaurar estado</button> <button data-cmd="ignite">convulsão</button></div>
        <div class="row"><b>Corpo</b>
          <button data-cmd="feed">alimentar</button> <button data-cmd="teleport">teleportar p/ centro</button>
          <button data-cmd="set_need" data-need="romance">romance no máximo</button> <button data-cmd="set_need" data-need="fun">diversão no máximo</button></div>
        <div class="row"><b>Mundo</b>
          <button data-cmd="add_food">+ comida (perto da selecionada)</button> <button data-cmd="add_ball">+ bola</button>
          <button data-cmd="add_robot">+ robô na superfície</button> <button data-cmd="pause">pausar</button> <button data-cmd="resume">continuar</button></div>
      </div>
      <div id="brainpanel"><div id="braininfo" class="muted"></div><canvas id="traces" width="300" height="140"></canvas></div>
      <canvas id="braincanvas"></canvas>
      <div id="load">carregando replay…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
